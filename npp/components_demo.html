<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Demo</title>
    <style>

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
img, picture, video, canvas, svg {
  display: block;
  max-width: 100%;
}
input, button, textarea, select {
  font: inherit;
}
p, h1, h2, h3, h4, h5, h6 {
  overflow-wrap: break-word;
}


/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap');

:root {
  --npp-bg: #f8fafc;
  --npp-surface: #ffffff;
  --npp-surface-card: #ffffff;
  --npp-text: #0f172a;
  --npp-text-muted: #64748b;
  --npp-primary: #4f46e5;
  --npp-primary-hover: #4338ca;
  --npp-border: #e2e8f0;
  --npp-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --npp-accent: #06b6d4;
}

body {
  background-color: #f8fafc;
  color: var(--npp-text);
  font-family: 'Inter', sans-serif;
  padding: 0;
  margin: 0;
}

/* Typography */
h1, h2, h3, h4, h5, h6 {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  line-height: 1.25;
  color: var(--npp-text);
  margin-bottom: 0.75rem;
}
h1 { font-size: 2.5rem; }
h2 { font-size: 2rem; }
h3 { font-size: 1.5rem; }
p { margin-bottom: 1rem; color: var(--npp-text); }
a { color: var(--npp-primary); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--npp-accent); text-decoration: underline; }

/* Code blocks */
code, pre, kbd {
  font-family: 'Fira Code', monospace;
  background: rgba(0,0,0,0.25);
  border-radius: 6px;
}
code { padding: 0.2em 0.4em; font-size: 0.9em; }
pre { padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }

/* Container & Layout */
.npp-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  width: 100%;
}

.npp-grid {
  display: grid;
  gap: 1.5rem;
}
.npp-grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.npp-grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.npp-grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

.npp-flex {
  display: flex;
  gap: 1rem;
  align-items: center;
}

/* High-level Components */
.npp-navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: var(--npp-surface);
  border-bottom: 1px solid var(--npp-border);
  
  position: sticky;
  top: 0;
  z-index: 100;
}
.npp-brand {
  font-family: 'Outfit', sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--npp-text);
}
.npp-nav-links {
  display: flex;
  gap: 1.5rem;
  list-style: none;
}

.npp-hero {
  text-align: center;
  padding: 5rem 1.5rem 4rem;
  background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 70%);
}
.npp-hero h1 {
  font-size: 3.5rem;
  letter-spacing: -0.02em;
  margin-bottom: 1.25rem;
}
.npp-hero p {
  font-size: 1.25rem;
  color: var(--npp-text-muted);
  max-width: 650px;
  margin: 0 auto 2rem;
}

.npp-card {
  background: var(--npp-surface-card);
  border: 1px solid var(--npp-border);
  border-radius: 14px;
  padding: 1.75rem;
  box-shadow: var(--npp-shadow);
  
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.npp-card:hover {
  transform: translateY(-4px);
  border-color: var(--npp-primary);
}
.npp-card h3 {
  margin-bottom: 0.5rem;
}
.npp-card p {
  color: var(--npp-text-muted);
  margin-bottom: 1rem;
}

.npp-button, button, input[type="submit"] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background: var(--npp-primary);
  color: #ffffff;
  padding: 0.7rem 1.4rem;
  border-radius: 8px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  text-decoration: none !important;
}
.npp-button:hover, button:hover {
  background: var(--npp-primary-hover);
  transform: translateY(-1px);
}
.npp-button-secondary {
  background: transparent;
  color: var(--npp-text);
  border: 1px solid var(--npp-border);
}
.npp-button-secondary:hover {
  background: var(--npp-surface);
  color: var(--npp-accent);
}

.npp-badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 9999px;
  font-size: 0.8rem;
  font-weight: 600;
  background: rgba(99, 102, 241, 0.15);
  color: var(--npp-primary);
  border: 1px solid rgba(99, 102, 241, 0.3);
}

.npp-alert {
  padding: 1rem 1.25rem;
  border-radius: 10px;
  margin-bottom: 1rem;
  border: 1px solid var(--npp-border);
  background: var(--npp-surface);
}

/* Form elements */
input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--npp-border);
  background: var(--npp-surface);
  color: var(--npp-text);
  margin-bottom: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--npp-primary);
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 1.5rem;
  border-radius: 8px;
  overflow: hidden;
}
th, td {
  padding: 0.85rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--npp-border);
}
th {
  background: var(--npp-surface);
  font-weight: 600;
}
tr:hover {
  background: rgba(255,255,255,0.02);
}

/* Footer */
footer, .npp-footer {
  margin-top: auto;
  padding: 2.5rem 1.5rem;
  border-top: 1px solid var(--npp-border);
  text-align: center;
  color: var(--npp-text-muted);
  background: var(--npp-surface);
}

</style>
  </head>
  <body>
    <nav class="npp-navbar">
      <div class="npp-brand">TechCorp</div>
      <ul class="npp-nav-links">
        <li>
          <a href="#">Products</a>
        </li>
        <li>
          <a href="#">About</a>
        </li>
      </ul>
      <a href="#" class="npp-button">Sign In</a>
    </nav>
    <div class="npp-grid npp-grid-3">
      <div class="npp-card">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚡</div>
        <h3>Fast</h3>
        <p>Zero build config needed.</p>
      </div>
      <div class="npp-card">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">✨</div>
        <h3>Clean</h3>
        <p>Pure English syntax.</p>
      </div>
      <div class="npp-card">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">📱</div>
        <h3>Responsive</h3>
        <p>Mobile friendly by default.</p>
      </div>
    </div>
  </body>
</html>
